<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="shastra">
  <!-- The lagna: a point rising on the horizon, inside the frame of a chart.

       The lagna is the one value that makes a chart yours. It moves a whole
       sign every two hours, so it is the thing a birth minute actually fixes,
       and it is what this product computes before anything else.

       It replaced a plain ring, which was legible and meant nothing, and
       before that the North Indian kundli square, which every astrology site
       in India already uses and which turns to mush below 24px. A frame, a
       line and a disc survive 16px and say something only this product says. -->
  <rect width="64" height="64" fill="#FAF9F6"/>
  <g fill="none" stroke="#22211C" stroke-width="3.2">
    <rect x="11" y="11" width="42" height="42"/>
    <path d="M11 38h42"/>
  </g>
  <circle cx="24" cy="38" r="6.5" fill="#B4342A"/>
</svg>
