<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="shastra">
  <!-- The four main houses of a North Indian kundli, cut as windows from a solid
       block, with the first house lit because the rising sign is what makes a
       chart yours. Solid on purpose: the gaps between windows land at about one
       pixel at 16px, where thin lines and concentric outlines turn to a smudge.
       Colours are literal because a favicon cannot read the stylesheet. -->
  <rect x="2" y="2" width="60" height="60" fill="#831729"/><path fill="#C8102E" d="M32 7L43 18L32 29L21 18Z"/><path fill="#FBF4E6" d="M46 21L57 32L46 43L35 32Z"/><path fill="#FBF4E6" d="M32 35L43 46L32 57L21 46Z"/><path fill="#FBF4E6" d="M18 21L29 32L18 43L7 32Z"/>
</svg>
