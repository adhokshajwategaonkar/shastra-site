<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="shastra">
  <!-- The rasi band from the hero, reduced to what survives 16px: a solid ink
       ring, four divisions cut through it in paper, and one vermilion tick
       where the lagna rises.

       The old mark was the North Indian kundli square, which every astrology
       site in India already uses and which turns to mush below 24px. The band
       is this product's own shape, it holds at 16px because it is a mass
       rather than a lattice, and the single red tick is the same second plate
       the wordmark's full stop uses.

       On a paper tile, not transparent: browser chrome is dark as often as it
       is light, and an ink ring on nothing disappears into half of it. -->
  <rect width="64" height="64" fill="#FAF9F6"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#22211C" stroke-width="11"/>
  <g stroke="#FAF9F6" stroke-width="2.6">
    <path d="M32 16V26M32 38V48M16 32H26M38 32H48"/>
  </g>
  <path d="M32 16V26" stroke="#B4342A" stroke-width="2.6" transform="rotate(45 32 32)"/>
</svg>
